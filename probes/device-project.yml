name: DeviceProbes

options:
  bundleIdPrefix: com.haroldmartin.apple-ai-probes
  deploymentTarget:
    iOS: "27.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.2

targets:
  DeviceProbeHost:
    type: application
    platform: iOS
    sources:
      - DeviceProbeHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Device Probes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.haroldmartin.apple-ai-probes.host
        TARGETED_DEVICE_FAMILY: 1

  ProbeSupport:
    type: framework
    platform: iOS
    sources:
      - Sources/ProbeSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.haroldmartin.apple-ai-probes.support

  DeviceProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ProbesTests
      - path: DeviceProbeAssets
        buildPhase: resources
        type: folder
    dependencies:
      - target: DeviceProbeHost
      - target: ProbeSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.haroldmartin.apple-ai-probes.tests

schemes:
  DeviceProbes:
    build:
      targets:
        DeviceProbeHost: all
        DeviceProbeTests:
          - test
    test:
      targets:
        - DeviceProbeTests
      # The PROBE_* knobs are declared HERE so `xcodegen generate` preserves them
      # (a variable hand-added in the scheme editor is wiped on every regeneration).
      # All are disabled by default until the operator ticks a checkbox for a one-off
      # run or flips isEnabled to true here before regenerating. The three host-model
      # consent variables affect Simulator runs of this project; physical devices
      # compile out that gate.
      environmentVariables:
        - variable: PROBE_ENABLE_HOST_MODEL
          value: "1"
          isEnabled: false
        - variable: PROBE_ENABLE_ATTACHMENT
          value: "1"
          isEnabled: false
        - variable: PROBE_ENABLE_GENERATOR
          value: "1"
          isEnabled: false
        - variable: PROBE_ENABLE_PCC
          value: "1"
          isEnabled: false
        - variable: PROBE_AIMODEL_URL
          value: "/absolute/host/path/to/model.aimodelc"
          isEnabled: false
        - variable: PROBE_ENUM_RUNS
          value: "100"
          isEnabled: false
        - variable: PROBE_CONCURRENT_SESSIONS
          value: "16"
          isEnabled: false
        - variable: PROBE_ARTIFACT_DIR
          value: "/absolute/output/path"
          isEnabled: false
        - variable: PROBE_INSTRUMENTS_WORKLOAD
          value: "1"
          isEnabled: false
        - variable: PROBE_WORKLOAD_SECONDS
          value: "300"
          isEnabled: false
        - variable: PROBE_WORKLOAD_ATTACH_SECONDS
          value: "20"
          isEnabled: false

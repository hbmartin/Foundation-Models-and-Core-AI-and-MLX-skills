version = 1
id = "daily-corpus-freshness-sweep"
kind = "cron"
name = "Daily corpus freshness sweep"
rrule = "RRULE:FREQ=DAILY;BYHOUR=8;BYMINUTE=0"
cwds = ["."]
prompt = """
Work in this repository. Read notes/FRESHNESS-RUNBOOK.md first and follow Section 1 as the source of truth.

Contract policy fingerprint: f022efd3a27f06e6e3f2b2434b47ee089a795ddae85ed9e3f56f471401c969a4

Run ./scripts/validate-automation-contracts.py --installed first. Create a collision-free UTC run id and set report_dir to artifacts/freshness/daily-defects/<UTC-run-id>. Run ./scripts/refresh-defect-statuses.sh --changed-only --format json --output "$report_dir/defects.json", then run ./scripts/current-state.py collect --output "$report_dir/observed-state.json" and read both reports. The references array is changed-only, but the summary covers every extracted reference: treat any nonzero UNREACHABLE count as a failed GitHub check even when the references array is empty. Run the selected toolchain ground checks: xcodebuild -version; xcrun simctl list runtimes and inspect iOS runtimes; and xcrun --no-cache --find fm, explicitly noting if the FM CLI has appeared. Check Apple Developer News/Releases and the Foundation Models updates page for a new Xcode beta, simulator runtime, macOS build, or relevant documentation update.

Report only actionable findings, including exact issue or PR references, old versus live state, relevant dates, and which guide or runbook item needs human review. Link the durable report in report_dir. If nothing changed, state that the daily sweep is clean. Do not edit guides or notes, create branches, commit, or push. If a command or web check cannot run, report the exact blocker and continue with the remaining independent checks.
"""

[contract]
schema_version = 2
mutation_policy = "tracked-read-only"
allowed_paths = ["artifacts/"]
artifact_patterns = [
  "artifacts/freshness/daily-defects/<UTC-run-id>/defects.json",
  "artifacts/freshness/daily-defects/<UTC-run-id>/observed-state.json",
]
required_prompt_fragments = [
  "./scripts/validate-automation-contracts.py --installed",
  "./scripts/refresh-defect-statuses.sh",
  "--changed-only",
  "--format json",
  "--output",
  "./scripts/current-state.py collect",
  "xcodebuild -version",
  "xcrun simctl list runtimes",
  "xcrun --no-cache --find fm",
]

version = 1
id = "weekly-corpus-freshness-batch"
kind = "cron"
name = "Weekly corpus freshness batch"
rrule = "RRULE:FREQ=WEEKLY;BYDAY=MO;BYHOUR=9;BYMINUTE=0"
cwds = ["."]
prompt = """
Work in this repository. Read notes/FRESHNESS-RUNBOOK.md first and follow Section 2 as the source of truth.

Create one collision-free UTC run id and set report_dir to artifacts/freshness/weekly-defects/<UTC-run-id>. Run ./scripts/refresh-defect-statuses.sh --format json --output "$report_dir/defects.json" and read that JSON report. Summarize STATE-CHANGED and UNREACHABLE items, identify files with several STALE-DATE-ONLY hedges, and list a bounded set of AMBIGUOUS citations worth fixing.

Run the probes through the durable clean-build wrapper: AUTOMATION_ID=weekly-probes PROBE_RUN_ID="${run_id}-host" ./scripts/run-probes.sh host, then AUTOMATION_ID=weekly-probes PROBE_RUN_ID="${run_id}-simulator" ./scripts/run-probes.sh simulator. The wrapper stores both runs under artifacts/freshness/weekly-probes. Compare PROBE-RESULT values with probes/README.md and report behavioral drift; do not compare hard-coded test or skip counts.

Run ./scripts/clone-research-repos.sh to restore the pinned research mirrors under repos/. This ignored mirror refresh is the only intended filesystem mutation. Do not advance snapshots to upstream HEAD. Read notes/NEXT-BETA-CHECKLIST.md Sections 4–8 and inspect the linked watched-contradiction documentation pages for changes.

Produce a concise report with pass or fail per step, exact evidence for drift, and recommended human follow-up. Link the durable defect report and probe artifact directories. Do not edit tracked files, guides, or notes, create branches, commit, or push; do not mutate anything outside repos/ and artifacts/. If a command, GitHub query, simulator, or web check is unavailable, report the exact blocker and continue with the remaining independent checks.
"""

[contract]
schema_version = 1
mutation_policy = "bounded"
allowed_paths = ["artifacts/", "repos/"]
artifact_patterns = [
  "artifacts/freshness/weekly-defects/<UTC-run-id>/defects.json",
  "artifacts/freshness/weekly-probes/<UTC-run-id>-host/",
  "artifacts/freshness/weekly-probes/<UTC-run-id>-simulator/",
]
required_prompt_fragments = [
  "./scripts/refresh-defect-statuses.sh",
  "--format json",
  "--output",
  "./scripts/run-probes.sh host",
  "./scripts/run-probes.sh simulator",
  "./scripts/clone-research-repos.sh",
]

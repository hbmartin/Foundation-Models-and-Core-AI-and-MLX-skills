name: documentation-pages

on:
  push:
    branches: [main]
    paths:
      - 'guides/**'
      - 'overrides/**'
      - 'scripts/mdslug.py'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/tests/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'guides/**'
      - 'overrides/**'
      - 'scripts/mdslug.py'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/tests/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NO_MKDOCS_2_WARNING: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Test documentation tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Build documentation
        run: mkdocs build --strict --clean

      - name: Verify generated site and source immutability
        run: |
          test -s .build/mkdocs-site/index.html
          test -s .build/mkdocs-site/API-INDEX/index.html
          test -s .build/mkdocs-site/SILENT-FAILURES/index.html
          test -s .build/mkdocs-site/search/search_index.json
          test "$(find .build/mkdocs-site -name index.html | wc -l)" -eq 80
          git diff --exit-code -- guides

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/mkdocs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
